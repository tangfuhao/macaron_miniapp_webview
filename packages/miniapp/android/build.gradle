apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.macaron.miniapp'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useExpoPublishing()

buildscript {
  def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '1.8.10'

  repositories {
    mavenCentral()
  }

  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }
}

android {
  compileSdkVersion 35

  def agpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
  if (agpVersion >= 7) {
    namespace "com.macaron.miniapp"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }

  kotlinOptions {
    jvmTarget = '21'
  }

  defaultConfig {
    minSdkVersion 23
    targetSdkVersion 35
    versionCode 1
    versionName "0.1.0"
  }

  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
  // 添加本地 AAR 庫的路徑
  flatDir {
    dirs 'libs'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${getKotlinVersion()}"
  
  // MacaronCapacitorBridge - 使用預編譯的 AAR
  // 這個 AAR 包含了所有 Capacitor 依賴
  implementation(name: 'macaron-capacitor-bridge', ext: 'aar')
  
  // 添加 Capacitor AAR 需要的傳遞依賴
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
  implementation 'androidx.core:core-ktx:1.12.0'
  implementation 'androidx.webkit:webkit:1.4.0'
}

